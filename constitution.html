<h1>憲法　過去問準拠・実戦問題</h1>
<p class="sub">海事代理士試験の実際の出題型に合わせ、条文穴埋めと正誤問題を中心に反復します。</p>
<div class="analysis"><strong>出題傾向：</strong>近年の憲法は10点構成で、典型的に「条文穴埋め5問＋憲法・判例の正誤5問」。人権だけでなく、国会・内閣・司法・財政から広く出題されます。条文の数字・機関名・定型句を正確に覚えるのが得点源です。</div>
<div class="tabs"><button id="tabMix" class="on" onclick="start('mix')">実戦10問</button><button id="tabFill" onclick="start('fill')">穴埋め特訓</button><button id="tabTf" onclick="start('tf')">正誤特訓</button></div>
<div class="score"><span id="modeName">実戦10問</span><span><span id="num">1</span>/<span id="total">10</span>　正解 <span id="score">0</span></span></div>
<div id="area"></div>
<button class="next" id="next" onclick="nextQ()" disabled>次の問題</button>
<button class="reset" onclick="start(currentMode)">最初からやり直す</button>
<div class="footer">本教材は国土交通省公表の海事代理士試験過去問の出題形式・頻出分野を踏まえたオリジナル演習です。過去問そのものの丸写しではなく、同じ論点を繰り返し解けるよう再構成しています。</div>
</div>
<script>
const DATA={"fill": [["第13条", "すべて国民は、個人として尊重される。生命、自由及び【　】に対する国民の権利については、公共の福祉に反しない限り、最大の尊重を必要とする。", "幸福追求", "令和3年出題系統"], ["第14条", "すべて国民は、法の下に平等であつて、人種、信条、性別、社会的身分又は門地により、政治的、経済的又は社会的関係において、【　】されない。", "差別", "令和5年出題"], ["第23条", "学問の【　】は、これを保障する。", "自由", "基本的人権"], ["第25条", "すべて国民は、健康で文化的な【　】の生活を営む権利を有する。", "最低限度", "社会権"], ["第26条", "すべて国民は、法律の定めるところにより、その能力に応じて、ひとしく教育を受ける【　】を有する。", "権利", "令和5年出題"], ["第27条", "すべて国民は、勤労の権利を有し、【　】を負ふ。", "義務", "勤労"], ["第28条", "勤労者の団結する権利及び【　】その他の団体行動をする権利は、これを保障する。", "団体交渉", "令和3年出題系統"], ["第11条", "この憲法が国民に保障する基本的人権は、侵すことのできない【　】として、現在及び将来の国民に与へられる。", "永久の権利", "令和元年出題"], ["第41条", "国会は、国権の【　】であつて、国の唯一の立法機関である。", "最高機関", "令和元・5年出題"], ["第42条", "国会は、衆議院及び【　】の両議院でこれを構成する。", "参議院", "国会"], ["第45条", "衆議院議員の任期は、【　】とする。但し、衆議院解散の場合には、その期間満了前に終了する。", "四年", "令和5年出題"], ["第46条", "参議院議員の任期は、六年とし、【　】ごとに議員の半数を改選する。", "三年", "正誤頻出"], ["第52条", "国会の常会は、毎年【　】回これを召集する。", "一", "令和6年出題"], ["第53条", "いづれかの議院の総議員の【　】以上の要求があれば、内閣は、国会の臨時会の召集を決定しなければならない。", "四分の一", "令和3年出題"], ["第56条", "両議院は、各々その総議員の【　】以上の出席がなければ、議事を開き議決することができない。", "三分の一", "国会"], ["第57条", "両議院の会議は、公開とする。但し、出席議員の【　】以上の多数で議決したときは、秘密会を開くことができる。", "三分の二", "正誤頻出"], ["第67条", "内閣総理大臣は、国会議員の中から国会の議決で、これを【　】する。", "指名", "内閣"], ["第68条", "内閣総理大臣は、国務大臣を任命する。但し、その【　】は、国会議員の中から選ばれなければならない。", "過半数", "令和6年出題"], ["第69条", "内閣は、衆議院で不信任の決議案を可決し、又は信任の決議案を否決したときは、【　】日以内に衆議院が解散されない限り、総辞職をしなければならない。", "十", "令和元・5年出題"], ["第70条", "内閣総理大臣が欠けたとき、又は衆議院議員総選挙の後に初めて国会の召集があつたときは、内閣は【　】をしなければならない。", "総辞職", "正誤頻出"], ["第76条", "すべて裁判官は、その良心に従ひ独立してその職権を行ひ、この憲法及び【　】にのみ拘束される。", "法律", "司法"], ["第78条", "裁判官は、裁判により、【　】のために職務を執ることができないと決定された場合を除いては、公の弾劾によらなければ罷免されない。", "心身の故障", "令和元年出題"], ["第79条", "最高裁判所は、その長たる裁判官及び法律の定める員数のその他の裁判官でこれを構成し、その長たる裁判官以外の裁判官は、【　】でこれを任命する。", "内閣", "令和3年出題"], ["第83条", "国の財政を処理する権限は、【　】の議決に基いて、これを行使しなければならない。", "国会", "正誤頻出"], ["第87条", "予見し難い予算の不足に充てるため、国会の議決に基いて【　】を設け、内閣の責任でこれを支出することができる。", "予備費", "令和元年出題"], ["第91条", "内閣は、国会及び【　】に対し、定期に、少くとも毎年一回、国の財政状況について報告しなければならない。", "国民", "令和3年出題"], ["第9条", "日本国民は、正義と秩序を基調とする国際平和を誠実に希求し、国権の発動たる【　】と、武力による威嚇又は武力の行使は、国際紛争を解決する手段としては、永久にこれを放棄する。", "戦争", "令和6年出題"], ["第96条", "この憲法の改正は、各議院の総議員の【　】以上の賛成で、国会が、これを発議する。", "三分の二", "憲法改正"]], "tf": [["国会", "衆議院議員と参議院議員を同時に兼ねることはできない。", true, "憲法48条。"], ["国会", "参議院議員の任期は六年で、三年ごとに議員の半数を改選する。", true, "憲法46条。令和6年出題。"], ["国会", "両議院の会議は、出席議員の過半数の議決で秘密会とすることができる。", false, "秘密会には出席議員の3分の2以上の多数が必要。"], ["国会", "国会の常会は毎年二回召集される。", false, "毎年1回。憲法52条。"], ["国会", "衆議院議員の任期は四年であるが、衆議院が解散された場合は期間満了前に終了する。", true, "憲法45条。"], ["内閣", "内閣総理大臣は国会議員の中から国会の議決で指名される。", true, "憲法67条。"], ["内閣", "国務大臣は全員が国会議員でなければならない。", false, "過半数が国会議員であればよい。憲法68条。"], ["内閣", "衆議院で内閣不信任決議案が可決された場合、内閣は直ちに総辞職しなければならない。", false, "10日以内に衆議院を解散すれば総辞職を免れる。"], ["内閣", "内閣総理大臣が欠けたときは、内閣は総辞職しなければならない。", true, "憲法70条。令和3年正誤系統。"], ["司法", "裁判官の懲戒処分は、行政機関が行うことができる。", false, "憲法78条は行政機関による懲戒を禁止。"], ["司法", "最高裁判所の長たる裁判官以外の裁判官は、内閣が任命する。", true, "憲法79条。"], ["司法", "裁判官は、公の弾劾による場合以外には、いかなる場合も罷免されない。", false, "心身の故障により職務不能と裁判で決定された場合がある。"], ["財政", "国の財政を処理する権限は、最高裁判所の決定に基づいて行使される。", false, "国会の議決に基づく。憲法83条。令和6年出題。"], ["財政", "内閣は、国会及び国民に対し、少なくとも毎年一回、国の財政状況を報告しなければならない。", true, "憲法91条。"], ["人権", "憲法上の義務教育無償は、授業料だけでなく教科書・学用品など一切の費用の無償を当然に意味する。", false, "判例上、そのようには解されていない。令和3年出題系統。"], ["人権", "何人も、法律の定める手続によらなければ、その生命若しくは自由を奪われ、又はその他の刑罰を科せられない。", true, "憲法31条。"], ["人権", "外国人には憲法上の人権は一切保障されない。", false, "性質上日本国民のみを対象とする権利を除き、外国人にも保障が及ぶと解される。"], ["人権", "学問の自由は憲法上保障されている。", true, "憲法23条。"], ["平和主義", "憲法9条1項は、国際紛争を解決する手段としての戦争と武力による威嚇・武力行使を永久に放棄すると定める。", true, "憲法9条。令和6年穴埋め系統。"], ["憲法改正", "憲法改正の発議には、各議院の総議員の3分の2以上の賛成が必要である。", true, "憲法96条。"]]};
let currentMode='mix', qs=[], idx=0, score=0, answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeFill(x){return {type:'fill',art:x[0],q:x[1],ans:x[2],note:x[3]}}
function makeTf(x){return {type:'tf',cat:x[0],q:x[1],ans:x[2],note:x[3]}}
function start(mode){
 currentMode=mode;idx=0;score=0;answered=false;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
 document.getElementById(mode==='mix'?'tabMix':mode==='fill'?'tabFill':'tabTf').classList.add('on');
 if(mode==='mix'){qs=[...shuffle(DATA.fill).slice(0,5).map(makeFill),...shuffle(DATA.tf).slice(0,5).map(makeTf)]; document.getElementById('modeName').textContent='実戦10問';}
 if(mode==='fill'){qs=shuffle(DATA.fill).map(makeFill);document.getElementById('modeName').textContent='穴埋め特訓';}
 if(mode==='tf'){qs=shuffle(DATA.tf).map(makeTf);document.getElementById('modeName').textContent='正誤特訓';}
 document.getElementById('total').textContent=qs.length;document.getElementById('score').textContent=0;render();
}
function norm(s){return s.trim().replace(/[ 　]/g,'').replace(/4/g,'四').replace(/3/g,'三').replace(/2/g,'二').replace(/1/g,'一').replace(/10/g,'十')}
function render(){
 if(idx>=qs.length){document.getElementById('area').innerHTML=`<div class="card"><h2>終了</h2><div class="q">正解数：<strong>${score} / ${qs.length}</strong></div></div>`;document.getElementById('num').textContent=qs.length;document.getElementById('next').disabled=true;return}
 answered=false;document.getElementById('next').disabled=true;document.getElementById('num').textContent=idx+1;
 const q=qs[idx];
 if(q.type==='fill') document.getElementById('area').innerHTML=`<div class="card"><div class="meta"><span>条文穴埋め</span><span>${q.art}</span></div><div class="q">${q.q}</div><div class="inputrow"><input id="inp" autocomplete="off" placeholder="答えを入力"><button class="check" onclick="checkFill()">解答</button></div><div id="ans" class="answer"></div></div>`;
 else document.getElementById('area').innerHTML=`<div class="card"><div class="meta"><span>正誤問題</span><span>${q.cat}</span></div><div class="q">${q.q}</div><div class="tfrow"><button class="maru" onclick="checkTf(true)">○ 正しい</button><button class="batsu" onclick="checkTf(false)">× 誤り</button></div><div id="ans" class="answer"></div></div>`;
}
function finish(ok,text){if(answered)return;answered=true;if(ok){score++;document.getElementById('score').textContent=score};let a=document.getElementById('ans');a.classList.add('show');a.innerHTML=`<span class="${ok?'ok':'ng'}">${ok?'正解':'不正解'}</span><br>${text}`;document.getElementById('next').disabled=false}
function checkFill(){let q=qs[idx],v=document.getElementById('inp').value;finish(norm(v)===norm(q.ans),`正答：<strong>${q.ans}</strong><br>${q.note}`)}
function checkTf(v){let q=qs[idx];finish(v===q.ans,`正答：<strong>${q.ans?'○':'×'}</strong><br>${q.note}`)}
function nextQ(){idx++;render()}
start('mix');
</script></body></html>
