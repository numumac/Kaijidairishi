<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>船員法 3択反復学習</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#172033;background:#f4f6f9}
*{box-sizing:border-box} body{margin:0}.wrap{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:8px 0 4px}.sub{color:#667085;margin:0 0 16px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 2px 14px #00000012;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:13px;color:#667085;display:block;margin-bottom:5px}select,input,button{font:inherit;width:100%;border-radius:12px;border:1px solid #cfd6e3;padding:12px;background:white}
button{cursor:pointer;font-weight:700}.primary{background:#1769e0;color:white;border:0}.choice{text-align:left;margin:8px 0;background:#fff}.choice.correct{border:2px solid #16803a;background:#edf9f0}.choice.wrong{border:2px solid #c62828;background:#fff0f0}
.meta{font-size:13px;color:#667085}.q{font-size:19px;line-height:1.65;font-weight:700;white-space:pre-wrap}.result{line-height:1.65;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:14px}
.good{color:#16803a;font-weight:800}.bad{color:#c62828;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eef2f7;border-radius:999px;padding:7px 10px;font-size:13px}
.hidden{display:none!important}.row{display:flex;gap:10px}.row button{flex:1}.note{font-size:13px;color:#667085;line-height:1.5}.big{font-size:30px;font-weight:800}
</style>
</head>
<body><div class="wrap">
<h1>船員法 3択反復学習</h1>
<p class="sub">統合改訂版・220問 / iPhone向け</p>

<section id="setup" class="card">
<div class="grid">
<div><label>出題範囲</label><select id="mode">
<option value="all">全220問</option>
<option value="基本100問">基本100問</option>
<option value="第3部・即答用語">第3部・即答用語</option>
<option value="第4部・数字要件">第4部・数字要件</option>
<option value="category">分野別</option>
<option value="weak">苦手問題優先</option>
</select></div>
<div><label>問題数</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="all">全問</option></select></div>
<div class="full hidden" id="catbox"><label>分野</label><select id="category"></select></div>
<div class="full"><button class="primary" id="start">学習開始</button></div>
</div>
<p class="note">成績はこの端末のブラウザ内に保存します。間違えた問題は最後に自動で再出題します。</p>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="stats"><span class="pill" id="progress"></span><span class="pill" id="tag"></span><span class="pill" id="score"></span></div>
<p class="q" id="question"></p>
<div id="choices"></div>
<div id="feedback" class="result hidden"></div>
<div class="row"><button id="quit">終了</button><button class="primary hidden" id="next">次の問題</button></div>
</div>
</section>

<section id="finish" class="card hidden">
<div class="big" id="finalScore"></div><p id="finalText"></p>
<div class="row"><button id="home">最初に戻る</button><button class="primary hidden" id="review">誤答を復習</button></div>
</section>
</div>
<script>
const QUESTIONS=[{"id":1,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法上の「船員」に含まれる組合せとして正しいものはどれですか？","choices":["船長・海員・予備船員","船長・旅客・予備船員","海員・旅客・荷主"],"answer":0,"explanation":"船員は、船長及び海員並びに予備船員をいいます。","article":"第1条","importance":"A"},{"id":2,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法の適用対象となる船舶から原則として除かれるものはどれですか？","choices":["総トン数5トン未満の船舶","総トン数50トン未満のすべての船舶","総トン数500トン未満の漁船"],"answer":0,"explanation":"第1条2項は総トン数5トン未満の船舶を除外しています。","article":"第1条第2項","importance":"A"},{"id":3,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法上、湖、川又は港のみを航行する船舶は原則どう扱われますか？","choices":["適用対象から除かれる","必ず適用される","国際航海の場合だけ適用される"],"answer":0,"explanation":"湖、川又は港のみを航行する船舶は第1条2項の除外対象です。","article":"第1条第2項","importance":"A"},{"id":4,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法上の「海員」の説明として正しいものはどれですか？","choices":["船内で使用される船長以外の乗組員で、労働の対償として報酬を受ける者","船長を含むすべての乗船者","船内で働く旅客を含む者"],"answer":0,"explanation":"海員は船内で使用される船長以外の乗組員で、労働の対償として報酬を受ける者です。","article":"第2条第1項","importance":"A"},{"id":5,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法上の「予備船員」の説明として正しいものはどれですか？","choices":["対象船舶に乗り組むため雇用されている者で、船内で使用されていない者","臨時に船長を代行する者","退職後に再雇用を待つ者"],"answer":0,"explanation":"予備船員は、対象船舶に乗り組むため雇用されているが船内で使用されていない者です。","article":"第2条第2項","importance":"A"},{"id":6,"part":"基本100問","category":"総則","type":"基礎・総合","q":"「職員」に含まれるものとして船員法が明示しているものはどれですか？","choices":["航海士","旅客係","荷主代理人"],"answer":0,"explanation":"職員には航海士、機関長、機関士、通信長、通信士等が含まれます。","article":"第3条","importance":"A"},{"id":7,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法上の「部員」とはどれですか？","choices":["職員以外の海員","船長以外の全乗船者","予備船員だけ"],"answer":0,"explanation":"部員とは職員以外の海員をいいます。","article":"第3条第2項","importance":"A"},{"id":8,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法上の「給料」の定義として適切なものはどれですか？","choices":["一定の金額により定期に支払う報酬のうち基本となる固定給","賞与のみ","時間外手当だけ"],"answer":0,"explanation":"給料は、一定額で定期に支払われる報酬のうち基本となる固定給です。","article":"第4条第1項","importance":"A"},{"id":9,"part":"基本100問","category":"総則","type":"基礎・総合","q":"海員の「労働時間」に含まれるのは原則どの時間ですか？","choices":["上長の職務上の命令により作業に従事する時間","船内にいる全時間","睡眠時間を含む乗船全時間"],"answer":0,"explanation":"海員については、上長の職務上の命令により作業に従事する時間が労働時間です。","article":"第4条第2項","importance":"A"},{"id":10,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船舶共有の場合、船舶所有者に関する規定は原則誰に適用されますか？","choices":["船舶管理人","最年長の船員","船長の親族"],"answer":0,"explanation":"船舶共有の場合には船舶管理人に適用されます。","article":"第5条","importance":"A"},{"id":11,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船舶貸借の場合、船舶所有者に関する規定は原則誰に適用されますか？","choices":["船舶借入人","貸主だけ","港長"],"answer":0,"explanation":"船舶貸借の場合には船舶借入人に適用されます。","article":"第5条","importance":"A"},{"id":12,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船舶所有者等以外の者が船員を使用する場合、船舶所有者に関する規定は原則どうなりますか？","choices":["その使用者に適用される","適用されない","船長だけに適用される"],"answer":0,"explanation":"一定の例外を除き、実際に船員を使用する者に適用されます。","article":"第5条","importance":"A"},{"id":13,"part":"基本100問","category":"総則","type":"基礎・総合","q":"船員法第1条第2項の除外船舶に含まれる漁船の基準として正しいものはどれですか？","choices":["政令で定める総トン数30トン未満の漁船","すべての漁船","総トン数300トン未満の漁船"],"answer":0,"explanation":"政令で定める総トン数30トン未満の漁船が除外対象です。","article":"第1条第2項第3号","importance":"A"},{"id":14,"part":"基本100問","category":"総則","type":"基礎・総合","q":"「職員」と「部員」の区別を定める条文はどれですか？","choices":["第3条","第13条","第30条"],"answer":0,"explanation":"第3条が職員と部員を定義しています。","article":"第3条","importance":"A"},{"id":15,"part":"基本100問","category":"総則","type":"基礎・総合","q":"「給料」と「労働時間」の定義を定める条文はどれですか？","choices":["第4条","第14条","第40条"],"answer":0,"explanation":"第4条が給料と労働時間を定義しています。","article":"第4条","importance":"A"},{"id":16,"part":"基本100問","category":"船長","type":"基礎・総合","q":"船長の指揮命令権として正しいものはどれですか？","choices":["海員を指揮監督し、船内にある者に職務上必要な命令をすることができる","旅客の私生活全般を無制限に命令できる","港長の許可なく罰金を科せる"],"answer":0,"explanation":"船長には海員の指揮監督権と、職務上必要な範囲で船内者への命令権があります。","article":"第7条","importance":"A"},{"id":17,"part":"基本100問","category":"船長","type":"基礎・総合","q":"発航前の検査について定める条文はどれですか？","choices":["第8条","第18条","第28条"],"answer":0,"explanation":"発航前の検査は第8条です。","article":"第8条","importance":"A"},{"id":18,"part":"基本100問","category":"船長","type":"基礎・総合","q":"航海の成就について定める条文はどれですか？","choices":["第9条","第19条","第29条"],"answer":0,"explanation":"航海の成就は第9条です。","article":"第9条","importance":"A"},{"id":19,"part":"基本100問","category":"船長","type":"基礎・総合","q":"船長が自ら甲板上で指揮すべき場面として典型的なものはどれですか？","choices":["港の出入りや狭い水路の通過など","船員の休日中の私用外出","船内食堂の献立決定だけ"],"answer":0,"explanation":"港の出入り等、航海上重要な場面では船長が甲板上で指揮します。","article":"第10条","importance":"A"},{"id":20,"part":"基本100問","category":"船長","type":"基礎・総合","q":"船長の在船義務を定める条文はどれですか？","choices":["第11条","第21条","第31条"],"answer":0,"explanation":"在船義務は第11条です。","article":"第11条","importance":"A"},{"id":21,"part":"基本100問","category":"船長","type":"基礎・総合","q":"船舶に危険がある場合の処置について定める条文はどれですか？","choices":["第12条","第22条","第32条"],"answer":0,"explanation":"船舶に危険がある場合の処置は第12条です。","article":"第12条","importance":"A"},{"id":22,"part":"基本100問","category":"船長","type":"基礎・総合","q":"船舶が衝突した場合の処置について定める条文はどれですか？","choices":["第13条","第23条","第33条"],"answer":0,"explanation":"衝突時の処置は第13条です。","article":"第13条","importance":"A"},{"id":23,"part":"基本100問","category":"船長","type":"基礎・総合","q":"非常配置表及び操練について定める条文はどれですか？","choices":["第14条の3","第24条の3","第34条の3"],"answer":0,"explanation":"非常配置表及び操練は第14条の3です。","article":"第14条の3","importance":"A"},{"id":24,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"海員が守るべき事項として正しいものはどれですか？","choices":["上長の職務上の命令に従うこと","船長の許可なくいつでも船を去ること","船内の淡水を自由に濫費すること"],"answer":0,"explanation":"第21条は上長の職務上の命令に従うこと等を定めます。","article":"第21条","importance":"A"},{"id":25,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"海員が船長の許可なく行ってはならない行為として定められているものはどれですか？","choices":["救命艇その他の重要な属具を使用すること","自分の船員手帳を読むこと","休息時間に睡眠すること"],"answer":0,"explanation":"救命艇その他の重要な属具を船長の許可なく使用してはなりません。","article":"第21条","importance":"A"},{"id":26,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"船長が海員を懲戒できるのはどのような場合ですか？","choices":["海員が第21条の事項を守らないとき","船員が有給休暇を請求したとき","船員が給料を受け取ったとき"],"answer":0,"explanation":"海員が船内秩序に関する第21条の事項を守らないとき、船長は懲戒できます。","article":"第22条","importance":"A"},{"id":27,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"船長による懲戒の種類として正しい組合せはどれですか？","choices":["上陸禁止・戒告","減給・懲役","罰金・免許取消し"],"answer":0,"explanation":"船員法上の船長の懲戒は上陸禁止と戒告です。","article":"第22条以下","importance":"A"},{"id":28,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"懲戒としての上陸禁止の期間は原則何日以内ですか？","choices":["10日以内","30日以内","60日以内"],"answer":0,"explanation":"上陸禁止は初日を含め10日以内とされます。","article":"第23条","importance":"A"},{"id":29,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"上陸禁止の期間に算入されるのは原則どの日ですか？","choices":["停泊日","航海日だけ","休日だけ"],"answer":0,"explanation":"上陸禁止期間には停泊日数を算入します。","article":"第23条","importance":"A"},{"id":30,"part":"基本100問","category":"紀律","type":"基礎・総合","q":"船長が行政庁に援助を請求できるのはどのような場合ですか？","choices":["船内の者の行為が人命・船舶に危害を及ぼす等、秩序を著しく乱す場合","船内売店の品切れの場合","通常の休息時間を設定する場合"],"answer":0,"explanation":"人命・船舶への危害や船内秩序の著しい混乱がある場合、必要に応じ行政庁へ援助を請求できます。","article":"第29条","importance":"A"},{"id":31,"part":"基本100問","category":"雇入契約","type":"基礎・総合","q":"船員法の基準に達しない労働条件を定めた雇入契約はどうなりますか？","choices":["その部分が無効となり、法定基準の労働条件を定めたものとみなされる","契約全体が必ず無効となる","そのまま有効となる"],"answer":0,"explanation":"基準未達部分のみ無効となり、その部分は法定基準に達する条件とみなされます。","article":"第31条","importance":"A"},{"id":32,"part":"基本100問","category":"雇入契約","type":"基礎・総合","q":"雇入契約の不履行について、船舶所有者が違約金を定める契約はできますか？","choices":["できない","自由にできる","船長の承認があれば必ずできる"],"answer":0,"explanation":"違約金を定め、または損害賠償額を予定する契約は禁止されています。","article":"第33条","importance":"A"},{"id":33,"part":"基本100問","category":"雇入契約","type":"基礎・総合","q":"雇入契約の不履行について損害賠償額をあらかじめ予定する契約はどう扱われますか？","choices":["禁止される","必ず必要","100万円以下なら自由"],"answer":0,"explanation":"損害賠償額を予定する契約は禁止されています。","article":"第33条","importance":"A"},{"id":34,"part":"基本100問","category":"雇入契約","type":"基礎・総合","q":"予備船員を解雇しようとする場合、原則として何日前に予告しますか？","choices":["30日前","7日前","90日前"],"answer":0,"explanation":"予備船員の解雇は原則30日前予告です。","article":"第4章（予備船員の解雇予告）","importance":"A"},{"id":35,"part":"基本100問","category":"雇入契約","type":"基礎・総合","q":"予備船員を30日前に予告せず解雇する場合の原則的な予告手当はどれですか？","choices":["1箇月分の給料の額と同額","3日分の食費","6箇月分の ,"importance":"A"},{"id":129,"part":"第3部・即答用語","category":"災害補償・送還","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「雇入契約終了時などに船員を所定の地まで帰還させる制度」","choices":["送還","懲戒","検認"],"answer":0,"explanation":"正解は「送還」です。雇入契約終了時などに船員を所定の地まで帰還させる制度","article":"第47条以下","importance":"A"},{"id":130,"part":"第3部・即答用語","category":"災害補償・送還","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「送還中の船員の生活保障等に関係する手当」","choices":["送還手当","救命艇手当","国籍手当"],"answer":0,"explanation":"正解は「送還手当」です。送還中の船員の生活保障等に関係する手当","article":"第49条","importance":"B"},{"id":131,"part":"第3部・即答用語","category":"行政・監督","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「国土交通大臣が所部職員から命じ、船員法等の施行に関する事項を掌る職員」","choices":["船員労務官","労務管理責任者","船長"],"answer":0,"explanation":"正解は「船員労務官」です。国土交通大臣が所部職員から命じ、船員法等の施行に関する事項を掌る職員","article":"第105条","importance":"A"},{"id":132,"part":"第3部・即答用語","category":"行政・監督","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「船員労務官が船員法等の違反の罪について行うことがある刑事手続上の職務」","choices":["司法警察員","船舶所有者","海事代理士"],"answer":0,"explanation":"正解は「司法警察員」です。船員労務官が船員法等の違反の罪について行うことがある刑事手続上の職務","article":"第108条","importance":"A"},{"id":133,"part":"第3部・即答用語","category":"行政・監督","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「船員法上、届出・監督・証書交付等の中心的な行政権限を有する行政庁」","choices":["国土交通大臣","市町村長のみ","船長のみ"],"answer":0,"explanation":"正解は「国土交通大臣」です。船員法上、届出・監督・証書交付等の中心的な行政権限を有する行政庁","article":"船員法各条","importance":"B"},{"id":134,"part":"第3部・即答用語","category":"行政・監督","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「船員行政の実務を担う地方組織として各種手続の窓口となる機関」","choices":["地方運輸局","労働基準監督署だけ","海上保安庁だけ"],"answer":0,"explanation":"正解は「地方運輸局」です。船員行政の実務を担う地方組織として各種手続の窓口となる機関","article":"権限委任規定・関係省令","importance":"C"},{"id":135,"part":"第3部・即答用語","category":"行政・監督","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「外国において船員法上の一定の事務を行うことがある日本の行政機関」","choices":["領事官","船長の代理人","外国の港長"],"answer":0,"explanation":"正解は「領事官」です。外国において船員法上の一定の事務を行うことがある日本の行政機関","article":"第103条等","importance":"C"},{"id":136,"part":"第3部・即答用語","category":"現行法更新","type":"用語・制度","q":"次の説明に最も当てはまる用語はどれですか？\n「通常の場合における船員の船内作業の時間帯・作業内容を定め、掲示 ory":"給料","type":"要件","q":"歩合報酬が雇入契約で定めた一定額に達しない月の扱いはどれですか？","choices":["一定額を下回ってはならない","ゼロでもよい","船長の裁量で半額にする"],"answer":0,"explanation":"歩合報酬には一定額の最低保障があります。","article":"第58条","importance":"A"},{"id":214,"part":"第4部・数字要件","category":"労働時間","type":"例外","q":"1日14時間・週72時間という数字の性格として正しいものはどれですか？","choices":["一定の場合を含めた労働時間の限度","通常の基準労働時間","有給休暇日数"],"answer":0,"explanation":"8時間・40時間が基準、14時間・72時間が限度です。","article":"第60条・第65条の2","importance":"A"},{"id":215,"part":"第4部・数字要件","category":"有給休暇","type":"整理","q":"通常船員と沿海・平水国内航海船員の6箇月分有給休暇の組合せはどれですか？","choices":["15日・10日","10日・15日","20日・20日"],"answer":0,"explanation":"通常15日、特例対象10日です。","article":"第75条","importance":"A"},{"id":216,"part":"第4部・数字要件","category":"適用範囲","type":"例外","q":"「湖、川又は港のみを航行する船舶」の原則的扱いはどれですか？","choices":["船員法第1条の適用船舶から除外","必ず全面適用","国際航海船として扱う"],"answer":0,"explanation":"第1条第2項の除外船舶です。","article":"第1条第2項第2号","importance":"A"},{"id":217,"part":"第4部・数字要件","category":"適用範囲","type":"例外","q":"スポーツ・レクリエーション用の一定の小型船舶について正しいものはどれですか？","choices":["船員労働の特殊性が認められないものとして省令で定めるものは適用船舶から除外され得る","すべて必ず船員法が全面適用","総トン数に関係なく外国船扱い"],"answer":0,"explanation":"現行第1条第2項第4号に一定の小型船舶の除外があります。","article":"第1条第2項第4号","importance":"A"},{"id":218,"part":"第4部・数字要件","category":"船員手帳","type":"要件","q":"18歳未満の船員に関する船員手帳の認証を行う者は誰ですか？","choices":["国土交通大臣","船長だけ","市町村長だけ"],"answer":0,"explanation":"18歳未満の船員を使用する場合は船員手帳に国土交通大臣の認証を受けます。","article":"第84条等","importance":"A"},{"id":219,"part":"第4部・数字要件","category":"安全衛生","type":"要件","q":"年齢18歳未満の船員について制限対象となるのはどれですか？","choices":["危険・有害な一定の作業","すべての食事","船員手帳の所持"],"answer":0,"explanation":"18歳未満には危険・有害作業の就業制限があります。","article":"第85条第2項等","importance":"A"},{"id":220,"part":"第4部・数字要件","category":"安全衛生","type":"改正","q":"2026年現行法の安全衛生分野で新たに重視されるものとして適切なのはどれですか？","choices":["基本訓練・実技講習等","旅客名簿の復活","船員労働委員会の新設"],"answer":0,"explanation":"2026年改正では基本訓練・実技講習等の制度が盛り込まれています。","article":"第81条の2以下","importance":"A"}];
const $=id=>document.getElementById(id);
const STATS_KEY="senin_iphone_stats_v1";
let stats=JSON.parse(localStorage.getItem(STATS_KEY)||"{}");
let queue=[], wrong=[], pos=0, correct=0, answered=false, reviewMode=false;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cats=[...new Set(QUESTIONS.map(q=>q.category))].sort();
cats.forEach(c=>{let o=document.createElement("option");o.value=o.textContent=c;$("category").appendChild(o)});
$("mode").onchange=()=>$("catbox").classList.toggle("hidden",$("mode").value!=="category");

function weakness(q){
 let s=stats[q.id]; if(!s||!s.n)return 1.5+Math.random();
 return s.wrong*2+(1-s.ok/s.n)*3+Math.random()/100;
}
function saveStat(q,ok){
 let s=stats[q.id]||{n:0,ok:0,wrong:0};s.n++;ok?s.ok++:s.wrong++;stats[q.id]=s;
 localStorage.setItem(STATS_KEY,JSON.stringify(stats));
}
function start(){
 let mode=$("mode").value,pool=QUESTIONS;
 if(["基本100問","第3部・即答用語","第4部・数字要件"].includes(mode))pool=pool.filter(q=>q.part===mode);
 if(mode==="category")pool=pool.filter(q=>q.category===$("category").value);
 let n=$("count").value==="all"?pool.length:Math.min(+ $("count").value,pool.length);
 queue=mode==="weak"?[...pool].sort((a,b)=>weakness(b)-weakness(a)).slice(0,n):shuffle(pool).slice(0,n);
 wrong=[];pos=0;correct=0;reviewMode=false;$("setup").classList.add("hidden");$("finish").classList.add("hidden");$("quiz").classList.remove("hidden");show();
}
function show(){
 answered=false;$("next").classList.add("hidden");$("feedback").classList.add("hidden");
 let q=queue[pos];$("progress").textContent=`${pos+1} / ${queue.length}`;$("tag").textContent=`${q.part}・${q.category}`;$("score").textContent=`正解 ${correct}`;
 $("question").textContent=q.q;$("choices").innerHTML="";
 let opts=q.choices.map((t,i)=>({t,i}));opts=shuffle(opts);
 opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.t;b.onclick=()=>answer(b,o.i,opts);$("choices").appendChild(b)});
}
function answer(btn,idx,opts){
 if(answered)return;answered=true;let q=queue[pos],ok=idx===q.answer;saveStat(q,ok);
 [...$("choices").children].forEach((b,k)=>{let original=opts[k].i;if(original===q.answer)b.classList.add("correct")});
 if(ok){correct++;$("feedback").innerHTML='<span class="good">○ 正解です！</span>'}
 else{btn.classList.add("wrong");wrong.push(q);$("feedback").innerHTML=`<span class="bad">× 不正解です。</span><br><b>正解：</b>${q.choices[q.answer]}<br><b>根拠：</b>${q.article}<br><b>解説：</b>${q.explanation}`}
 $("feedback").classList.remove("hidden");$("score").textContent=`正解 ${correct}`;$("next").classList.remove("hidden");
}
function next(){pos++;if(pos<queue.length)show();else finish()}
function finish(){
 $("quiz").classList.add("hidden");$("finish").classList.remove("hidden");
 $("finalScore").textContent=`${correct} / ${queue.length}`;
 $("finalText").textContent=wrong.length?`誤答は ${wrong.length} 問です。誤答だけをもう一度解けます。`:"全問正解しました！";
 $("review").classList.toggle("hidden",wrong.length===0);
}
$("review").onclick=()=>{queue=shuffle(wrong);wrong=[];pos=0;correct=0;reviewMode=true;$("finish").classList.add("hidden");$("quiz").classList.remove("hidden");show()};
$("home").onclick=()=>{$("finish").classList.add("hidden");$("quiz").classList.add("hidden");$("setup").classList.remove("hidden")};
$("quit").onclick=()=>{if(confirm("今回の学習を終了しますか？")){$("quiz").classList.add("hidden");$("setup").classList.remove("hidden")}};
$("start").onclick=start;$("next").onclick=next;
</script></body></html>
