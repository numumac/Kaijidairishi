<body><div class="wrap">
<h1>船員法 過去問準拠・実戦学習</h1>
<p class="sub">平成29年～令和7年の出題傾向を分析し、令和8年4月1日基準の法令で再構成。穴埋め・正誤・短答・口述を本試験型で反復します。</p>

<section id="setup" class="card">
<p class="sectiontitle">学習モード</p>
<div class="grid">
<div class="full"><label>モード</label><select id="mode">
<option value="mock">本試験型20問（穴埋め9＋正誤8＋短答3）</option>
<option value="穴埋め">穴埋め問題</option>
<option value="正誤">正誤問題</option>
<option value="短答">短答・列挙問題</option>
<option value="口述">口述問題</option>
<option value="S">最重要Sだけ</option>
<option value="category">分野別</option>
<option value="weak">苦手問題優先</option>
</select></div>
<div id="countbox"><label>問題数</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="all">全問</option></select></div>
<div class="full hidden" id="catbox"><label>分野</label><select id="category"></select></div>
<div class="full"><button class="primary" id="start">学習開始</button></div>
</div>
<p class="note">穴埋めは語群をタップ、正誤は○×をタップ。短答・口述は先に自分で答えてから「解答を見る」を押し、「できた／できなかった」で自己採点します。</p>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="progressbar"><div id="bar"></div></div>
<div class="meta"><span class="pill" id="progress"></span><span class="pill format-badge" id="fmt"></span><span class="pill" id="tag"></span><span class="pill" id="years"></span></div>
<div class="q" id="question"></div>
<div id="response" style="margin-top:14px"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="row"><button id="quit">終了</button><button class="primary hidden" id="next">次へ</button></div>
</div>
</section>

<section id="finish" class="card hidden">
<div class="big" id="finalScore"></div>
<p id="finalText"></p>
<div class="row"><button id="home">最初に戻る</button><button class="primary hidden" id="review">誤答・未達を復習</button></div>
<div id="reviewList" class="hidden"></div>
</section>
</div>
<script>
const Q=[{"id":1,"format":"穴埋め","category":"定義・適用","topic":"職員","q":"この法律において「（　）」とは、航海士、機関長、機関士、通信長、通信士その他国土交通省令で定める海員をいう。","bank":["職員","部員","予備船員","海員","船長","司厨員"],"answer":"職員","explanation":"職員の定義。令和3・7年に直接出題。","article":"第3条第1項","years":"R3,R7","importance":"S"},{"id":2,"format":"穴埋め","category":"定義・適用","topic":"部員","q":"この法律において「（　）」とは、職員以外の海員をいう。","bank":["部員","職員","予備船員","船長","海員","司厨員"],"answer":"部員","explanation":"部員は職員以外の海員。","article":"第3条第2項","years":"H30,R3","importance":"S"},{"id":3,"format":"穴埋め","category":"定義・適用","topic":"海員","q":"船内で使用される船長以外の乗組員で、労働の対償として給料その他の報酬を支払われる者を「（　）」という。","bank":["海員","船員","予備船員","職員","部員","船長"],"answer":"海員","explanation":"海員の定義は頻出。","article":"第2条第1項","years":"H30,R5,R6","importance":"S"},{"id":4,"format":"穴埋め","category":"定義・適用","topic":"予備船員","q":"船舶に乗り組むため雇用されている者で船内で使用されていないものを「（　）」という。","bank":["予備船員","海員","部員","職員","船長","船員労務官"],"answer":"予備船員","explanation":"予備船員の定義。","article":"第2条第2項","years":"H29,R1","importance":"S"},{"id":5,"format":"穴埋め","category":"定義・適用","topic":"船員","q":"船員法上の「船員」は、船長及び海員並びに（　）をいう。","bank":["予備船員","職員","部員","船員労務官","船舶管理人","船舶借入人"],"answer":"予備船員","explanation":"船員＝船長＋海員＋予備船員。","article":"第1条","years":"R5","importance":"S"},{"id":6,"format":"穴埋め","category":"定義・適用","topic":"船舶共有","q":"船舶共有の場合、船舶所有者に関する規定は（　）に適用される。","bank":["船舶管理人","船舶借入人","船長","海員代表","労務管理責任者","船員労務官"],"answer":"船舶管理人","explanation":"船舶共有では船舶管理人。口述頻出。","article":"第5条","years":"H29,R3,R4,R5,R7","importance":"S"},{"id":7,"format":"穴埋め","category":"定義・適用","topic":"船舶貸借","q":"船舶貸借の場合、船舶所有者に関する規定は（　）に適用される。","bank":["船舶借入人","船舶管理人","船長","海員代表","労務管理責任者","船員労務官"],"answer":"船舶借入人","explanation":"船舶貸借では船舶借入人。","article":"第5条","years":"H29,R3,R4,R5,R7","importance":"S"},{"id":8,"format":"穴埋め","category":"船長","topic":"発航前検査","q":"船長は、国土交通省令の定めるところにより、（　）に船舶が航海に支障ないか等を検査しなければならない。","bank":["発航前","出港後","入港前","航海中","停泊中","出港直後"],"answer":"発航前","explanation":"発航前検査。","article":"第8条","years":"H29,R3,R5,R6","importance":"S"},{"id":9,"format":"穴埋め","category":"船長","topic":"航海成就","q":"船長は、航海の準備が終わったときは、（　）発航し、必要がある場合を除き予定航路を変更しないで到達港まで航行しなければならない。","bank":["速やかに","直ちに","翌日までに","24時間以内に","船主の承認後に","遅滞なく"],"answer":"速やかに","explanation":"航海成就の条文文言。","article":"第9条","years":"R7","importance":"S"},{"id":10,"format":"穴埋め","category":"船長","topic":"甲板指揮","q":"船長は、船舶が港を出入するとき、狭い水路を通過するとき等は、（　）にあって自ら船舶を指揮しなければならない。","bank":["甲板","船橋外","機関室","船員室","事務室","船尾のみ"],"answer":"甲板","explanation":"港出入・狭水路等の直接指揮。","article":"第10条","years":"R4","importance":"S"},{"id":11,"format":"穴埋め","category":"紀律","topic":"懲戒種類","q":"懲戒は、上陸禁止及び（　）の二種とする。","bank":["戒告","減給","けん責","罰金","免職","停職"],"answer":"戒告","explanation":"船員法の懲戒は上陸禁止と戒告。","article":"第23条","years":"R3,R4,R7","importance":"S"},{"id":12,"format":"穴埋め","category":"紀律","topic":"上陸禁止","q":"上陸禁止の期間は、初日を含めて（　）以内とする。","bank":["10日","5日","15日","20日","30日","1箇月"],"answer":"10日","explanation":"上陸禁止は10日以内。","article":"第23条","years":"R3","importance":"S"},{"id":13,"format":"穴埋め","category":"雇入契約","topic":"最低基準","q":"船員法の基準に達しない労働条件を定める（　）は、その部分について無効となる。","bank":["雇入契約","就業規則","労働協約","船員手帳","航海日誌","報酬支払簿"],"answer":"雇入契約","explanation":"最低基準未満の雇入契約部分は無効。","article":"第31条","years":"R3","importance":"S"},{"id":14,"format":"穴埋め","category":"雇入契約","topic":"予備船員解雇","q":"船舶所有者は、予備船員を解雇しようとする場合、少なくとも（　）前に予告しなければならない。","bank":["30日","10日","14日","20日","45日","60日"],"answer":"30日","explanation":"30日前予告。","article":"第4章","years":"H29,R3","importance":"S"},{"id":15,"format":"穴埋め","category":"雇入契約","topic":"予告手当","q":"30日前に予告しない場合、原則として一箇月分の給料と同額の（　）を支払う。","bank":["予告手当","失業手当","送還手当","傷病手当","行方不明手当","補償休日手当"],"answer":"予告手当","explanation":"予告手当。","article":"第4章","years":"H29,R3","importance":"S"},{"id":16,"format":"穴埋め","category":"雇入契約","topic":"解除申入れ","q":"期間の定めのない雇入契約を船員が解除する場合、（　）以上の期間を定めて書面で申し入れる。","bank":["24時間","12時間","48時間","3日","7日","30日"],"answer":"24時間","explanation":"24時間以上。","article":"第4章","years":"R2","importance":"S"},{"id":17,"format":"穴埋め","category":"給料・報酬","topic":"報酬決 const $=id=>document.getElementById(id);
const KEY="senin_practical_stats_v1";
let stats=JSON.parse(localStorage.getItem(KEY)||"{}");
let queue=[],miss=[],pos=0,score=0,answered=false;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cats=[...new Set(Q.map(x=>x.category))].sort();
cats.forEach(c=>{let o=document.createElement("option");o.value=o.textContent=c;$("category").appendChild(o)});

$("mode").onchange=()=>{
 const m=$("mode").value;
 $("catbox").classList.toggle("hidden",m!=="category");
 $("countbox").classList.toggle("hidden",m==="mock");
};

function weakScore(q){
 const s=stats[q.id]; if(!s||!s.n)return 2+Math.random();
 return s.bad*2+(1-s.ok/s.n)*3+Math.random()/100;
}
function saveStat(q,ok){
 let s=stats[q.id]||{n:0,ok:0,bad:0}; s.n++; ok?s.ok++:s.bad++; stats[q.id]=s;
 localStorage.setItem(KEY,JSON.stringify(stats));
}
function buildQueue(){
 const mode=$("mode").value;
 if(mode==="mock"){
   const a=shuffle(Q.filter(x=>x.format==="穴埋め")).slice(0,9);
   const b=shuffle(Q.filter(x=>x.format==="正誤")).slice(0,8);
   const c=shuffle(Q.filter(x=>x.format==="短答")).slice(0,3);
   return shuffle([...a,...b,...c]);
 }
 let pool=Q;
 if(["穴埋め","正誤","短答","口述"].includes(mode))pool=pool.filter(x=>x.format===mode);
 if(mode==="S")pool=pool.filter(x=>x.importance==="S");
 if(mode==="category")pool=pool.filter(x=>x.category===$("category").value);
 const raw=$("count").value; const n=raw==="all"?pool.length:Math.min(+raw,pool.length);
 return mode==="weak"?[...pool].sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,n):shuffle(pool).slice(0,n);
}
function start(){
 queue=buildQueue();miss=[];pos=0;score=0;
 $("setup").classList.add("hidden");$("finish").classList.add("hidden");$("quiz").classList.remove("hidden");show();
}
function show(){
 answered=false;$("next").classList.add("hidden");$("feedback").classList.add("hidden");$("feedback").innerHTML="";
 const q=queue[pos];$("progress").textContent=`${pos+1} / ${queue.length}`;$("fmt").textContent=q.format;
 $("tag").textContent=`${q.category}・${q.topic}`;$("years").textContent=`過去問: ${q.years}`;
 $("bar").style.width=`${(pos/queue.length)*100}%`;$("question").textContent=q.q;
 const r=$("response");r.innerHTML="";
 if(q.format==="穴埋め"){
   const box=document.createElement("div");box.className="bank";const opts=shuffle(q.bank);
   opts.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>answerFill(b,t,opts);box.appendChild(b)});r.appendChild(box);
 }else if(q.format==="正誤"){
   const box=document.createElement("div");box.className="tf";
   ["○","×"].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>answerTF(b,t);box.appendChild(b)});r.appendChild(box);
 }else{
   const ta=document.createElement("textarea");ta.placeholder=q.format==="口述"?"まず声に出して答えてください（メモは任意）":"ここに自分の答えをメモしても構いません";r.appendChild(ta);
   const b=document.createElement("button");b.className="primary";b.style.marginTop="10px";b.textContent="解答を見る";b.onclick=()=>revealSelf(q);r.appendChild(b);
 }
}
function feedback(q,ok){
 const f=$("feedback");f.innerHTML=`<span class="${ok?'good':'bad'}">${ok?'○ 正解・達成':'× 誤答・未達'}</span><br><b>正解：</b>${q.answer}<br><b>根拠：</b>${q.article}<br><b>解説：</b>${q.explanation}`;
 f.classList.remove("hidden");$("next").classList.remove("hidden");
}
function answerFill(btn,t,opts){
 if(answered)return;answered=true;const q=queue[pos],ok=t===q.answer;saveStat(q,ok);if(ok)score++;else miss.push(q);
 [...$("response").querySelectorAll("button")].forEach(b=>{if(b.textContent===q.answer)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");feedback(q,ok);
}
function answerTF(btn,t){
 if(answered)return;answered=true;const q=queue[pos],ok=t===q.answer;saveStat(q,ok);if(ok)score++;else miss.push(q);
 [...$("response").querySelectorAll("button")].forEach(b=>{if(b.textContent===q.answer)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");feedback(q,ok);
}
function revealSelf(q){
 if(answered)return;answered=true;
 const r=$("response");const box=document.createElement("div");box.className="answerbox";box.innerHTML=`<b>模範解答</b><br>${q.answer}<br><br><b>根拠：</b>${q.article}<br><b>解説：</b>${q.explanation}`;r.appendChild(box);
 const row=document.createElement("div");row.className="row";
 const ng=document.createElement("button");ng.textContent="できなかった";ng.onclick=()=>selfGrade(q,false,ng,row);
 const ok=document.createElement("button");ok.className="primary";ok.textContent="できた";ok.onclick=()=>selfGrade(q,true,ok,row);
 row.appendChild(ng);row.appendChild(ok);r.appendChild(row);
}
function selfGrade(q,ok,btn,row){
 [...row.children].forEach(b=>b.disabled=true);btn.classList.add(ok?"correct":"wrong");saveStat(q,ok);if(ok)score++;else miss.push(q);$("next").classList.remove("hidden");
}
function next(){pos++;if(pos<queue.length)show();else finish()}
function finish(){
 $("bar").style.width="100%";$("quiz").classList.add("hidden");$("finish").classList.remove("hidden");
 $("finalScore").textContent=`${score} / ${queue.length}`;
 const rate=Math.round(score/queue.length*100);$("finalText").textContent=`達成率 ${rate}%　／　復習対象 ${miss.length}問`;
 $("review").classList.toggle("hidden",miss.length===0);
}
$("review").onclick=()=>{queue=shuffle(miss);miss=[];pos=0;score=0;$("finish").classList.add("hidden");$("quiz").classList.remove("hidden");show()};
$("home").onclick=()=>{$("finish").classList.add("hidden");$("quiz").classList.add("hidden");$("setup").classList.remove("hidden")};
$("quit").onclick=()=>{if(confirm("今回の学習を終了しますか？")){$("quiz").classList.add("hidden");$("setup").classList.remove("hidden")}};
$("start").onclick=start;$("next").onclick=next;
</script>
</body></html>
