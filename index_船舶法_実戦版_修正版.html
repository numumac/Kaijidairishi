<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>船舶法 過去問準拠・実戦学習</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17202a;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:25px}.sub{color:#5f6b78;line-height:1.55}.card{background:#fff;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 2px 12px #0001}label{display:block;font-size:13px;margin:10px 0 5px}select,button,input,textarea{font:inherit;width:100%;border-radius:12px;border:1px solid #d5dbe3;padding:13px;background:white}.primary{background:#1769e0;color:white;border:0;font-weight:800;margin-top:14px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#eef2f7;border-radius:999px;padding:7px 10px;font-size:13px}.q{font-size:20px;line-height:1.7;font-weight:750;white-space:pre-wrap}.row{display:flex;gap:9px;margin-top:12px}.answer{background:#f7f9fc;border-radius:12px;padding:14px;margin-top:14px;line-height:1.7}.hidden{display:none!important}.note{font-size:13px;color:#667085;line-height:1.6}textarea{min-height:90px}</style></head>
<body><div style="max-width:760px;margin:10px auto 0;padding:0 14px;"><a href="index.html" style="display:inline-block;text-decoration:none;background:#eef2f7;color:#344054;padding:10px 14px;border-radius:12px;font-weight:700;">← 20科目ホーム</a></div><div class="wrap"><h1>船舶法 過去問準拠・実戦学習</h1><p class="sub">国土交通省公表の海事代理士試験の出題傾向を踏まえ、筆記の穴埋め・正誤と口述対策を反復します。令和8年試験は令和8年4月1日現在施行の法令等が基準です。</p>
<section id="setup" class="card"><h2>学習モード</h2><label>モード</label><select id="mode"><option value="exam">本試験型20問（穴埋め10＋正誤5＋口述5）</option><option value="fill">穴埋め集中</option><option value="tf">正誤集中</option><option value="short">口述・短答集中</option><option value="all">全形式ランダム</option><option value="weak">苦手問題優先</option></select><label>問題数</label><select id="count"><option>10</option><option selected>20</option><option>30</option></select><button class="primary" id="start">学習開始</button><p class="note">口述は先に声に出して答えてから解答を確認してください。</p></section>
<section id="quiz" class="card hidden"><div class="meta"><span class="pill" id="progress"></span><span class="pill" id="kind"></span><span class="pill" id="score"></span></div><div class="q" id="q"></div><div id="inputArea"></div><div id="feedback"></div><div class="row"><button id="exitToHome">途中終了</button><button id="next" class="primary hidden">次の問題</button></div></section>
<section id="result" class="card hidden"><h2>結果</h2><div id="resultText" class="q"></div><div class="row"><button onclick="location.reload()">もう一度学習する</button><button class="primary" onclick="location.href='index.html'">20科目ホームへ戻る</button></div></section></div>
<script>const Q=[{"type": "fill", "q": "日本船舶の所有者は、登記をした後、船籍港を管轄する【　】に備えた船舶原簿に登録をすることを要する。", "a": "管海官庁", "exp": "船舶法第5条。令和6年筆記と同趣旨。"}, {"type": "fill", "q": "船舶国籍証書をその船舶の【　】を管轄する管海官庁等に提出して検認を受ける。", "a": "船籍港", "exp": "船舶法第5条ノ2。令和7年筆記。"}, {"type": "fill", "q": "船舶国籍証書の記載事項に変更を生じたとき、事実を知った日から【　】以内に書換えを申請する。", "a": "二週間", "exp": "船舶法第11条。令和7年筆記。"}, {"type": "fill", "q": "外国において交付する仮船舶国籍証書の有効期間は【　】を超えることができない。", "a": "一年", "exp": "船舶法第17条。令和7年筆記。"}, {"type": "fill", "q": "日本において交付する仮船舶国籍証書の有効期間は【　】を超えることができない。", "a": "六ヶ月", "exp": "船舶法第17条。令和6年筆記。"}, {"type": "fill", "q": "船籍港となるべき市町村は、船舶の航行し得べき【　】に接したものに限る。", "a": "水面", "exp": "船舶法施行細則。令和6年筆記。"}, {"type": "fill", "q": "船首【　】の外部に船名を標示する。", "a": "両舷", "exp": "船舶法施行細則第44条。令和7年筆記・口述。"}, {"type": "fill", "q": "船首・船尾に表示する船名等の文字は原則【　】センチメートル以上とする。", "a": "10", "exp": "船舶法施行細則第44条。令和7年筆記。"}, {"type": "fill", "q": "船舶が【　】間、存否不明であるとき、抹消登録をしなければならない。", "a": "三ヶ月", "exp": "船舶法第14条。令和7年口述。"}, {"type": "fill", "q": "仮船舶国籍証書の請受けには【　】の取得を証する書面を添付する。", "a": "所有権", "exp": "令和6・7年筆記の頻出事項。"}, {"type": "fill", "q": "船舶国籍証書の書換え後、旧証書は遅滞なく【　】する。", "a": "返還", "exp": "令和7年筆記。"}, {"type": "fill", "q": "日本船舶が滅失・沈没したとき等、事実を知った日から【　】以内に抹消登録をする。", "a": "二週間", "exp": "船舶法第14条。"}, {"type": "tf", "q": "総トン数20トン未満の船舶には、測度・登記・登録に関する規定が原則適用されない。", "a": "○", "exp": "船舶法第20条。"}, {"type": "tf", "q": "船舶国籍証書の交付前でも、登録済みなら日本国旗を掲揚して航行できる。", "a": "×", "exp": "船舶法第6条。証書又は仮証書の交付後でなければならない。"}, {"type": "tf", "q": "船舶国籍証書が毀損した場合には書換えの申請が必要である。", "a": "○", "exp": "船舶法第11条。"}, {"type": "tf", "q": "船舶国籍証書の書換え後、旧証書は所有者が保存する。", "a": "×", "exp": "旧証書は遅滞なく返還する。"}, {"type": "tf", "q": "船籍港はどの市町村でも自由に定められる。", "a": "×", "exp": "船舶の航行し得べき水面に接した市町村に限る。"}, {"type": "tf", "q": "船舶法施行細則上の船舶の種類は汽船と帆船である。", "a": "○", "exp": "施行細則第1条。令和7年口述。"}, {"type": "tf", "q": "船名にローマ字を使用することはできない。", "a": "×", "exp": "ローマ字等も使用できる。"}, {"type": "tf", "q": "総トン数の測度の申請先は船籍港を管轄する管海官庁である。", "a": "○", "exp": "船舶法第4条。令和7年口述。"}, {"type": "tf", "q": "仮船舶国籍証書の有効期間は国内交付と外国交付で同一である。", "a": "×", "exp": "国内6ヶ月、外国1年が上限。"}, {"type": "short", "q": "船舶法施行細則に規定する船舶の種類をすべて答えてください。", "a": "汽船、帆船", "exp": "施行細則第1条。令和7年口述。"}, {"type": "short", "q": "船舶国籍証書又は仮船舶国籍証書の交付後でなければしてはならないことを2つ答えてください。", "a": "日本の国旗を掲揚すること、航行すること", "exp": "船舶法第6条。令和6年口述。"}, {"type": "short", "q": "船名を標示する場所をすべて答えてください。", "a": "船首両舷の外部、船尾外部の見やすい場所", "exp": "施行細則第44条第1項。令和7年口述。"}, {"type": "short", "q": "管海官庁が総トン数の測度を行った場合、申請者に交付するものを2つ答えてください。", "a": "船舶件名書の謄本、総トン数計算書の謄本", "exp": "施行細則第12条ノ2第1項。令和7年口述。"}, {"type": "short", "q": "船舶国籍証書の書換えが必要となる場合を答えてください。", "a": "記載事項に変更を生じたとき、船舶国籍証書が毀損したとき", "exp": "船舶法第11条。令和7年口述。"}, {"type": "short", "q": "総トン数の測度の申請先を答えてください。", "a": "船籍港を管轄する管海官庁", "exp": "船舶法第4条。令和7年口述。"}, {"type": "short", "q": "船舶国籍証書の検認の基準期間を、100トン以上の鋼製船舶、100トン未満の鋼製船舶、木製船舶について答えてください。", "a": "100トン以上の鋼製船舶4年、100トン未満の鋼製船舶2年、木製船舶1年", "exp": "船舶法第5条ノ2。過去口述の重要事項。"}, {"type": "short", "q": "総トン数20トン未満の船舶以外に、船舶法第20条の適用対象外となる船舶の例を答えてください。", "a": "端舟、櫓櫂のみをもって運転する舟、主として櫓櫂をもって運転する舟", "exp": "船舶法第20条。令和6年口述。"}, {"type": "short", "q": "日本交付と外国交付の仮船舶国籍証書の有効期間の上限を答えてください。", "a": "日本：6ヶ月、外国：1年", "exp": "船舶法第17条。"}];let S=[],i=0,score=0,W=JSON.parse(localStorage.getItem('shipLawWeak')||'{}');const $=x=>document.getElementById(x);const sh=a=>[...a].sort(()=>Math.random()-.5);const pick=(t,n)=>sh(Q.filter(x=>x.type===t)).slice(0,n);
$('start').onclick=()=>{let m=$('mode').value,n=+$('count').value;if(m==='exam')S=[...pick('fill',10),...pick('tf',5),...pick('short',5)];else if(m==='all')S=sh(Q).slice(0,n);else if(m==='weak')S=sh([...Q].sort((a,b)=>(W[b.q]||0)-(W[a.q]||0))).slice(0,n);else S=pick(m,n);S=sh(S);$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');show()};
function show(){if(i>=S.length)return finish();let x=S[i];$('progress').textContent=(i+1)+' / '+S.length;$('kind').textContent=x.type==='fill'?'穴埋め':x.type==='tf'?'正誤':'口述・短答';$('score').textContent='正解 '+score;$('q').textContent=x.q;$('feedback').innerHTML='';$('next').classList.add('hidden');if(x.type==='fill')$('inputArea').innerHTML='<input id="ans" placeholder="答えを入力"><button class="primary" id="judge">判定</button>';if(x.type==='tf')$('inputArea').innerHTML='<div class="row"><button id="yes">○</button><button id="no">×</button></div>';if(x.type==='short')$('inputArea').innerHTML='<textarea placeholder="声に出して答えるか、ここに入力"></textarea><button class="primary" id="reveal">解答を見る</button>';if(x.type==='fill')$('judge').onclick=()=>judge($('ans').value.trim()===x.a,x);if(x.type==='tf'){$('yes').onclick=()=>judge(x.a==='○',x);$('no').onclick=()=>judge(x.a==='×',x)}if(x.type==='short')$('reveal').onclick=()=>{$('feedback').innerHTML='<div class="answer"><b>模範解答</b><br>'+x.a+'<br><span class="note">'+x.exp+'</span><div class="row"><button id="ok">できた</button><button id="ng">できなかった</button></div></div>';$('ok').onclick=()=>self(true,x);$('ng').onclick=()=>self(false,x)}}
function save(ok,x){if(ok){score++;W[x.q]=Math.max(0,(W[x.q]||0)-1)}else W[x.q]=(W[x.q]||0)+1;localStorage.setItem('shipLawWeak',JSON.stringify(W))}
function judge(ok,x){save(ok,x);$('feedback').innerHTML='<div class="answer"><b>'+(ok?'正解':'不正解')+'</b><br>答え：'+x.a+'<br><span class="note">'+x.exp+'</span></div>';$('next').classList.remove('hidden')}
function self(ok,x){save(ok,x);$('next').classList.remove('hidden')}$('next').onclick=()=>{i++;show()};function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultText').textContent=S.length+'問中 '+score+'問（'+Math.round(score/S.length*100)+'％）'}
const exitBtn = document.getElementById('exitToHome');
if (exitBtn) {
  exitBtn.onclick = () => {
    if (confirm('学習を途中で終了して20科目ホームへ戻りますか？')) {
      location.href = 'index.html';
    }
  };
}

</script></body></html>
